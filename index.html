<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영천고 급식</title>
<meta name="theme-color" content="#7c3aed">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f1eefb;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.9); --glass-border:rgba(255,255,255,.65);
  --sunk:rgba(124,58,237,.07);
  --text:#1b1530; --text2:#5d5678; --text3:#948ea9;
  --accent:#7c3aed; --accent2:#ec4899; --accent-l:rgba(124,58,237,.1);
  --red:#ef4444; --red-l:rgba(239,68,68,.12);
  --gold:#f59e0b; --gold-l:rgba(245,158,11,.14);
  --green:#10b981;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --sh:0 10px 34px rgba(88,40,170,.13); --sh-lg:0 20px 60px rgba(60,20,120,.24);
  --b1:rgba(139,92,246,.35); --b2:rgba(236,72,153,.28); --b3:rgba(251,191,36,.22);
}
.dark {
  --bg:#0b0916;
  --glass:rgba(26,21,42,.68); --glass-strong:rgba(30,25,48,.9); --glass-border:rgba(255,255,255,.08);
  --sunk:rgba(167,139,250,.08);
  --text:#f1eefc; --text2:#b3abce; --text3:#6a638c;
  --accent:#a78bfa; --accent2:#f472b6; --accent-l:rgba(167,139,250,.16);
  --red:#f87171; --red-l:rgba(248,113,113,.14);
  --gold:#fbbf24; --gold-l:rgba(251,191,36,.14);
  --green:#34d399;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --sh:0 10px 34px rgba(0,0,0,.4); --sh-lg:0 20px 60px rgba(0,0,0,.55);
  --b1:rgba(139,92,246,.28); --b2:rgba(236,72,153,.18); --b3:rgba(45,212,191,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;overflow-x:hidden}
button,input,textarea{font-family:inherit;color:inherit}

/* ── 배경 블롭 ── */
.bg-blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--b1);top:-140px;left:-120px}
.b2{width:380px;height:380px;background:var(--b2);top:20%;right:-160px;animation-delay:-6s}
.b3{width:460px;height:460px;background:var(--b3);bottom:-200px;left:20%;animation-delay:-12s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.bg-blob{animation:none}}

.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 16px 90px;display:flex;flex-direction:column;gap:14px}

/* ── 히어로 ── */
.hero{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-border);border-radius:26px;padding:20px 20px 14px;box-shadow:var(--sh)}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px var(--accent-l)}
.brand h1{font-size:19px;font-weight:900;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.03em;margin-top:1px}
.hero-actions{display:flex;gap:4px}
.icon-btn{background:var(--sunk);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:transform .15s,background .15s}
.icon-btn:hover{transform:scale(1.08);background:var(--accent-l)}

.hero-date{display:flex;align-items:center;justify-content:center;gap:4px;position:relative;margin-bottom:14px}
.nav-btn{background:none;border:none;color:var(--text3);width:34px;height:34px;border-radius:50%;font-size:19px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-btn:hover{color:var(--accent);background:var(--accent-l)}
.date-center{cursor:pointer;padding:2px 14px;text-align:center;user-select:none;border-radius:14px;transition:background .15s}
.date-center:hover{background:var(--sunk)}
.date-main{font-size:19px;font-weight:900;letter-spacing:-.03em}
.date-sub{font-size:10.5px;color:var(--text3);margin-top:1px;font-weight:700}
.pill-btn{font-family:inherit;font-size:11px;font-weight:800;background:var(--grad);color:#fff;border:none;border-radius:20px;padding:8px 15px;cursor:pointer;transition:opacity .15s;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.pill-btn:hover{opacity:.88}

.cal-popup{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--glass-strong);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:18px;padding:14px;box-shadow:var(--sh-lg);z-index:999;width:270px}
.cal-popup.show{display:block}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-top button{background:none;border:none;font-size:15px;font-weight:900;color:var(--accent);cursor:pointer;padding:3px 8px;border-radius:8px}
.cal-top button:hover{background:var(--accent-l)}
.cal-top span{font-size:13px;font-weight:800}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--text3);margin-bottom:5px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-d{text-align:center;font-size:12px;padding:7px 0;border-radius:9px;cursor:pointer;font-weight:600;transition:all .1s}
.cal-d:hover:not(.off):not(.empty){background:var(--accent-l);color:var(--accent)}
.cal-d.today{background:var(--gold-l);color:var(--gold);font-weight:800}
.cal-d.sel{background:var(--grad)!important;color:#fff!important;font-weight:800}
.cal-d.off{color:var(--text3);cursor:default}

.hero-tabs{display:flex;gap:4px;background:var(--sunk);border-radius:16px;padding:4px}
.meal-tab{flex:1;padding:9px 0;border:none;background:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .18s}
.meal-tab.on{color:#fff;font-weight:800;background:var(--grad);box-shadow:0 4px 14px rgba(124,58,237,.3)}
.meal-tab:hover:not(.on){color:var(--text2)}

/* ── 툴바 ── */
.toolbar{display:flex;gap:8px}
.search-box{flex:1;position:relative}
.search-box input{width:100%;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:16px;padding:11px 14px 11px 36px;font-size:13px;outline:none;transition:box-shadow .15s}
.search-box input:focus{box-shadow:0 0 0 3px var(--accent-l)}
.search-box::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
.tgl-btn{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:16px;padding:0 14px;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s}
.tgl-btn.on{background:var(--grad);color:#fff;border-color:transparent}
.tgl-btn:hover:not(.on){box-shadow:0 0 0 3px var(--accent-l)}

/* ── 칼로리 배너 ── */
.kcal-banner{display:none;align-items:center;justify-content:space-between;background:var(--grad);color:#fff;border-radius:16px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 6px 20px rgba(124,58,237,.28)}
.kcal-banner.show{display:flex}
.kcal-banner span{opacity:.95}
.kcal-banner button{background:rgba(255,255,255,.22);border:none;color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:5px 11px;cursor:pointer}
.kcal-banner button:hover{background:rgba(255,255,255,.34)}

/* ── 알레르기 드로어 ── */
.allergy-drawer{max-height:0;overflow:hidden;transition:max-height .28s ease}
.allergy-drawer.open{max-height:400px}
.allergy-inner{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:20px;padding:14px 16px;box-shadow:var(--sh)}
.allergy-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.allergy-hdr{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.allergy-ctl{display:flex;gap:6px;align-items:center}
.mode-toggle{display:flex;background:var(--sunk);border-radius:10px;padding:2px}
.mode-toggle button{background:none;border:none;font-size:10.5px;font-weight:700;color:var(--text3);padding:4px 9px;border-radius:8px;cursor:pointer}
.mode-toggle button.on{background:var(--glass-strong);color:var(--accent);box-shadow:var(--sh)}
.allergy-clear{background:none;border:none;font-size:10.5px;font-weight:700;color:var(--text3);cursor:pointer;text-decoration:underline}
.allergy-clear:hover{color:var(--red)}
.a-grid{display:flex;flex-wrap:wrap;gap:6px}
.a-item{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;border:1px solid transparent;background:var(--sunk);cursor:pointer;transition:all .12s;user-select:none}
.a-item.on{background:var(--red-l);border-color:var(--red)}
.a-num{font-size:10px;font-weight:800;color:var(--text3)}
.a-item.on .a-num{color:var(--red)}
.a-lbl{font-size:11px;font-weight:600;color:var(--text2)}
.a-item.on .a-lbl{color:var(--red);font-weight:700}

/* ── 메뉴 카드 그리드 ── */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.dish-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:20px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px;min-height:104px;position:relative;overflow:hidden}
.dish-card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.dish-card.warn{background:var(--red-l);border-color:rgba(239,68,68,.25)}
.dish-card.main{grid-column:1/-1;min-height:128px;background:var(--grad);border:none;color:#fff;justify-content:center}
.dish-card.main .dish-name{color:#fff;font-size:19px;font-weight:900}
.dish-card.main .sp-val,.dish-card.main .sp-count{color:#fff}
.dish-card.main::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.dc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.fav-btn{background:none;border:none;font-size:17px;color:var(--text3);cursor:pointer;flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.dish-card.main .fav-btn{color:rgba(255,255,255,.7)}
.fav-btn:hover{transform:scale(1.2)}
.fav-btn.on{color:var(--gold)}
.dish-card.main .fav-btn.on{color:#fff}
.best-badge{font-size:9px;font-weight:900;background:linear-gradient(135deg,var(--gold),#f97316);color:#fff;padding:2px 7px;border-radius:20px;letter-spacing:.03em;align-self:flex-start}
.dish-name{font-size:13.5px;font-weight:700;color:var(--text);letter-spacing:-.01em;line-height:1.35}
.a-nums{font-size:10px;color:var(--text3);font-weight:700;margin-left:2px}
.star-preview{display:flex;align-items:center;gap:5px;margin-top:auto}
.sp-stars{font-size:11px;line-height:1;letter-spacing:1px}
.sp-stars .f{color:var(--gold)}
.sp-stars .e{color:var(--text3);opacity:.4}
.dish-card.main .sp-stars .f{color:#ffe27a}
.dish-card.main .sp-stars .e{color:rgba(255,255,255,.4)}
.sp-val{font-size:11.5px;font-weight:800;color:var(--text)}
.sp-count{font-size:10px;color:var(--text3)}
.sp-none{font-size:10.5px;color:var(--text3);opacity:.5;letter-spacing:1px}

/* ── 주간 스트립 ── */
.week-wrap{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:22px;padding:14px 16px;box-shadow:var(--sh)}
.week-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.week-hdr-l{display:flex;align-items:baseline;gap:8px}
.week-hdr span.t{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.week-hdr span.r{font-size:10px;color:var(--text3);font-weight:600}
.week-nav-mini{display:flex;gap:2px}
.week-nav-mini button{background:none;border:none;color:var(--text3);width:24px;height:24px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.week-nav-mini button:hover{background:var(--accent-l);color:var(--accent)}
.week-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scroll-snap-type:x proximity}
.week-strip::-webkit-scrollbar{height:0}
.week-day{scroll-snap-align:start;flex:0 0 96px;background:var(--sunk);border-radius:16px;padding:10px 10px 12px;transition:all .12s;cursor:default}
.week-day.clickable{cursor:pointer}
.week-day.clickable:hover{background:var(--accent-l)}
.week-day.no-meal{opacity:.4}
.week-day.wd-today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.week-day.wd-sel{background:var(--grad)}
.week-day.wd-sel .wd-date,.week-day.wd-sel .wd-dayname,.week-day.wd-sel .wd-items,.week-day.wd-sel .wd-badge{color:#fff!important;background:rgba(255,255,255,.22)!important;opacity:1!important}
.wd-top{display:flex;flex-direction:column;margin-bottom:6px}
.wd-date{font-size:18px;font-weight:900;letter-spacing:-.03em}
.wd-dayname{font-size:10px;color:var(--text3);font-weight:700}
.wd-badge{font-size:9px;font-weight:800;background:var(--grad);color:#fff;border-radius:6px;padding:1px 5px;margin-top:3px;align-self:flex-start}
.wd-items{font-size:10.5px;color:var(--text2);line-height:1.5}
.wd-none{font-size:10.5px;color:var(--text3)}
.wd-loading{font-size:11px;color:var(--text3);padding:14px;text-align:center;width:100%}

/* ── 모달 공통 ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,10,25,.55);z-index:2000;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-overlay.show{display:flex}
.modal-sheet{background:var(--glass-strong);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--glass-border);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:0 0 32px;animation:slideUp .25s ease;box-shadow:0 -4px 40px rgba(0,0,0,.25)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:701px){
  .modal-overlay{align-items:center}
  .modal-sheet{border-radius:24px;max-height:82vh;animation:popIn .2s ease}
}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-handle{width:38px;height:4px;background:var(--text3);opacity:.4;border-radius:2px;margin:12px auto 0}
.modal-head{padding:18px 20px 16px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-dish-name{font-size:19px;font-weight:900;letter-spacing:-.03em}
.modal-close-x{background:var(--sunk);border:none;font-size:16px;color:var(--text3);cursor:pointer;width:30px;height:30px;border-radius:50%;flex-shrink:0}
.modal-close-x:hover{background:var(--accent-l)}
.modal-stat{display:flex;align-items:center;gap:12px;margin-top:10px}
.modal-stat-score{display:flex;flex-direction:column;align-items:center;padding-right:12px;border-right:1px solid var(--glass-border)}
.modal-avg{font-size:34px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.04em;line-height:1}
.modal-avg-max{font-size:12px;color:var(--text3);margin-top:2px}
.modal-stat-detail{display:flex;flex-direction:column;gap:3px}
.modal-stars-big{font-size:18px;letter-spacing:2px}
.modal-stars-big .f{color:var(--gold)}
.modal-stars-big .e{color:var(--text3);opacity:.4}
.modal-count-txt{font-size:12px;color:var(--text3)}
.modal-no-rating{font-size:13px;color:var(--text3)}
.modal-input-area{padding:16px 20px;border-bottom:1px solid var(--glass-border)}
.modal-input-label{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.star-row{display:flex;gap:4px;margin-bottom:12px}
.si-star{font-size:32px;cursor:pointer;color:var(--text3);opacity:.35;transition:all .1s;user-select:none;line-height:1}
.si-star.on{color:var(--gold);opacity:1;transform:scale(1.15)}
.review-textarea{width:100%;background:var(--sunk);border:1px solid var(--glass-border);border-radius:14px;color:var(--text);font-family:inherit;font-size:13px;padding:10px 12px;resize:none;outline:none;transition:box-shadow .15s;margin-bottom:10px}
.review-textarea:focus{box-shadow:0 0 0 3px var(--accent-l)}
.modal-submit-row{display:flex;gap:8px}
.btn-submit{flex:1;font-family:inherit;font-size:13px;font-weight:800;background:var(--grad);color:#fff;border:none;border-radius:14px;padding:12px 0;cursor:pointer;transition:opacity .15s;box-shadow:0 6px 18px rgba(124,58,237,.3)}
.btn-submit:hover{opacity:.88}
.btn-cancel{font-family:inherit;font-size:13px;font-weight:700;background:var(--sunk);color:var(--text2);border:1px solid var(--glass-border);border-radius:14px;padding:12px 18px;cursor:pointer}
.modal-reviews{padding:0 20px}
.reviews-label{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:16px 0 10px}
.rv-item{border-bottom:1px solid var(--glass-border);padding:12px 0}
.rv-item:last-child{border-bottom:none}
.rv-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.rv-stars{font-size:13px;letter-spacing:1px}
.rv-stars .f{color:var(--gold)}
.rv-stars .e{color:var(--text3);opacity:.4}
.rv-score{font-size:12px;font-weight:700;color:var(--text)}
.rv-mine{font-size:10px;font-weight:800;color:#fff;background:var(--grad);border-radius:20px;padding:1px 7px;margin-left:2px}
.rv-del{margin-left:auto;background:none;border:none;font-size:11px;color:var(--text3);cursor:pointer;font-weight:700}
.rv-del:hover{color:var(--red)}
.rv-comment{font-size:13px;color:var(--text2);line-height:1.5}
.rv-empty{font-size:13px;color:var(--text3);padding:16px 0;text-align:center}

/* ── 영양정보 모달 ── */
.info-body{padding:16px 20px 4px}
.info-sec{margin-bottom:18px}
.info-sec-title{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.info-line{font-size:13px;color:var(--text2);line-height:1.8;display:flex;justify-content:space-between;border-bottom:1px dashed var(--glass-border);padding:5px 0}
.info-empty{font-size:12.5px;color:var(--text3)}

/* ── 상태/스켈레톤/토스트 ── */
.state-box{grid-column:1/-1;padding:50px 16px;text-align:center;font-size:13px;color:var(--text3);line-height:1.6}
.state-box .em{font-size:28px;display:block;margin-bottom:8px}
.skeleton{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.sk-card{height:104px;border-radius:20px;background:linear-gradient(90deg,var(--sunk) 25%,var(--accent-l) 50%,var(--sunk) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:var(--bg);border-radius:20px;padding:10px 22px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);color:#fff}
.toast.ok{background:var(--green);color:#fff}

@media(max-width:520px){
  .brand h1{font-size:17px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPcpn_YncmqIxDx3EX_dpwCGK26hrOVlk",
  authDomain: "yc-meal.firebaseapp.com",
  projectId: "yc-meal",
  storageBucket: "yc-meal.firebasestorage.app",
  messagingSenderId: "605051414301",
  appId: "1:605051414301:web:69cab50573959031f0a3f4",
  measurementId: "G-1J34ECG7P8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const KEY  = '04b33987e1f94ec598b1835b6756736e';
const BASE = 'https://open.neis.go.kr/hub';
const SC   = '8750119';
const DAYS = ['일','월','화','수','목','금','토'];
const MEAL_NAME = {1:'조식',2:'중식',3:'석식'};
const AL   = [
  ['1','난류'],['2','우유'],['3','메밀'],['4','땅콩'],['5','대두'],['6','밀'],
  ['7','고등어'],['8','게'],['9','새우'],['10','돼지고기'],['11','복숭아'],['12','토마토'],
  ['13','아황산류'],['14','호두'],['15','닭고기'],['16','쇠고기'],['17','오징어'],
  ['18','조개류'],['19','잣']
];

/* ── 상태 ── */
let cur        = today(); fixWE(cur);
let weekAnchor = new Date(cur);
let calView    = new Date(cur);
let mt         = 2;
let isDark     = lsGet('yc_theme') === 'dark';
let myA        = new Set(JSON.parse(lsGet('yc_a') || '[]'));
let allergyMode= lsGet('yc_a_mode') || 'highlight';
let favorites  = new Set(JSON.parse(lsGet('yc_fav') || '[]'));
let favOnly    = false;
let searchQuery= '';
let myReviews  = JSON.parse(lsGet('yc_myrv') || '{}');
let ratings    = {};
let lastParsed = [];
let lastMeal   = null;
let modalScore = 0;
let modalKey   = '';

/* ── 유틸 ── */
function lsGet(k)     { try{return localStorage.getItem(k)}catch{return null} }
function lsSet(k,v)   { try{localStorage.setItem(k,v)}catch{} }
const $  = id => document.getElementById(id);
const pad= n  => String(n).padStart(2,'0');
function today(){ return new Date(); }
function toStr(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`; }
function fixWE(d){
  if(d.getDay()===6) d.setDate(d.getDate()+2);
  if(d.getDay()===0) d.setDate(d.getDate()+1);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, type){
  const t=$('toast'); t.textContent=msg; t.className='toast show'+(type?` ${type}`:'');
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove('show'),2200);
}
function dishKey(dateStr, mealType, name){ return `${dateStr}_${mealType}_${name}`; }

/* ── 별 HTML ── */
function starsHtml(score, max=5){
  return Array.from({length:max},(_,i)=>
    `<span class="${i<Math.round(score)?'f':'e'}">★</span>`
  ).join('');
}

/* ── 테마 ── */
function applyTheme(){
  document.body.className = isDark?'dark':'';
  $('themeBtn').textContent = isDark?'☀️':'🌙';
}
$('themeBtn').onclick=()=>{ isDark=!isDark; lsSet('yc_theme',isDark?'dark':'light'); applyTheme(); };
applyTheme();

/* ── 날짜 표시 ── */
function drawDate(){
  $('dateMain').textContent=`${cur.getFullYear()}.${pad(cur.getMonth()+1)}.${pad(cur.getDate())}`;
  $('dateSub').textContent=DAYS[cur.getDay()]+'요일';
}

/* ── 파싱 ── */
function parseItems(raw){
  return raw.split(/<br\s*\/>/i).map(s=>s.trim()).filter(Boolean).map(s=>{
    let name=s, nums=[];
    const m=name.match(/([\d]+(?:\.[\d]+)*)[^\w가-힣]*$/);
    if(m){
      nums=m[1].split('.').filter(x=>x&&!isNaN(+x));
      name=name.slice(0,m.index).replace(/[^\w가-힣]+$/, '').trim();
    }
    return {name,nums};
  });
}
function findMain(list){
  const flt=/^(밥|국|탕|찌개|김치|깍두기|단무지|우유|요구르트|주스|과일|푸딩|피클|양념|소스|드레싱|잼|버터)/;
  const kws=[
    {r:/볶음|구이|튀김|조림|가스|카츠|찜|스테이크|치킨|립/,s:10},
    {r:/닭|돈육|우육|돼지|소고기|오리|고기|베이컨|소시지|햄|오징어|새우|낙지|쭈꾸미/,s:8},
    {r:/파스타|스파게티|면|떡볶이|그라탕/,s:5}
  ];
  let max=-99,idx=0;
  list.forEach((item,i)=>{
    let sc=0;
    if(flt.test(item.name)) sc-=50;
    kws.forEach(k=>{if(k.r.test(item.name))sc+=k.s;});
    sc+=Math.min(item.name.length,10)*.5;
    if(sc>max){max=sc;idx=i;}
  });
  return (max<0&&list.length>2)?2:idx;
}

/* ── 알레르기 ── */
function buildAllergy(){
  const g=$('allergyGrid'); g.innerHTML='';
  AL.forEach(([n,l])=>{
    const el=document.createElement('div');
    el.className='a-item'+(myA.has(n)?' on':'');
    el.innerHTML=`<span class="a-num">${n}</span><span class="a-lbl">${l}</span>`;
    el.onclick=()=>{
      myA.has(n)?myA.delete(n):myA.add(n);
      el.classList.toggle('on');
      lsSet('yc_a',JSON.stringify([...myA]));
      renderMenu(lastParsed, toStr(cur), mt);
    };
    g.appendChild(el);
  });
}
function updateAllergyModeUI(){
  $('allergyModeToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.m===allergyMode));
}
$('allergyModeToggle').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{ allergyMode=b.dataset.m; lsSet('yc_a_mode',allergyMode); updateAllergyModeUI(); renderMenu(lastParsed, toStr(cur), mt); };
});
$('allergyClear').onclick=()=>{
  myA.clear(); lsSet('yc_a','[]'); buildAllergy(); renderMenu(lastParsed, toStr(cur), mt);
};
$('allergyToggleBtn').onclick=()=>{
  $('allergyDrawer').classList.toggle('open');
  $('allergyToggleBtn').classList.toggle('on', $('allergyDrawer').classList.contains('open'));
};
updateAllergyModeUI();

/* ── 검색 / 즐겨찾기 필터 ── */
let searchDebounce;
$('searchInput').oninput=e=>{
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>{ searchQuery=e.target.value; renderMenu(lastParsed, toStr(cur), mt); },120);
};
$('favOnlyBtn').onclick=()=>{
  favOnly=!favOnly;
  $('favOnlyBtn').classList.toggle('on',favOnly);
  renderMenu(lastParsed, toStr(cur), mt);
};

/* ── 메뉴 렌더 (카드 그리드) ── */
function renderMenu(parsed, dateStr, mealType){
  lastParsed=parsed;
  const list=$('menuList');
  if(!parsed||!parsed.length){
    list.innerHTML='<div class="state-box"><span class="em">🍽️</span>급식 정보가 없습니다</div>'; return;
  }
  const mainIdx=findMain(parsed);
  let items=parsed.map((item,i)=>({...item, idx:i}));

  const q=searchQuery.trim().toLowerCase();
  if(q) items=items.filter(it=>it.name.toLowerCase().includes(q));
  if(favOnly) items=items.filter(it=>favorites.has(it.name));
  if(allergyMode==='hide' && myA.size) items=items.filter(it=>!it.nums.some(n=>myA.has(n)));

  if(!items.length){
    list.innerHTML='<div class="state-box"><span class="em">🔍</span>조건에 맞는 메뉴가 없습니다</div>'; return;
  }

  list.innerHTML=items.map(item=>{
    const key=dishKey(dateStr, mealType, item.name);
    const hasA=item.nums.some(n=>myA.has(n));
    const stat=avgStat(key);
    const isFav=favorites.has(item.name);
    const isBest=stat && stat.avg>=4.5 && stat.count>=3;
    const isMain=item.idx===mainIdx;
    const safeName=escapeHtml(item.name);

    let numsHtml='';
    if(hasA && item.nums.length>0) numsHtml=` <span class="a-nums">${escapeHtml(item.nums.join('.'))}</span>`;

    const spHtml=stat
      ?`<div class="star-preview"><span class="sp-stars">${starsHtml(stat.avg)}</span><span class="sp-val">${stat.avg.toFixed(1)}</span><span class="sp-count">(${stat.count})</span></div>`
      :`<div class="star-preview"><span class="sp-none">☆☆☆☆☆</span></div>`;

    return `<div class="dish-card${hasA?' warn':''}${isMain?' main':''}" data-idx="${item.idx}">
      <div class="dc-top">
        <button class="fav-btn${isFav?' on':''}" data-name="${escapeHtml(item.name)}" title="즐겨찾기">${isFav?'★':'☆'}</button>
        ${isBest?'<span class="best-badge">BEST</span>':''}
      </div>
      <span class="dish-name">${safeName}${numsHtml}</span>
      ${spHtml}
    </div>`;
  }).join('');

  list.querySelectorAll('.dish-card').forEach(card=>{
    const idx=+card.dataset.idx;
    const item=parsed[idx];
    card.onclick=e=>{
      if(e.target.closest('.fav-btn')) return;
      openModal(item.name, dateStr, mealType);
    };
    card.querySelector('.fav-btn').onclick=e=>{
      e.stopPropagation();
      const name=e.currentTarget.dataset.name;
      favorites.has(name)?favorites.delete(name):favorites.add(name);
      lsSet('yc_fav',JSON.stringify([...favorites]));
      renderMenu(lastParsed, dateStr, mealType);
    };
  });
}
function avgStat(key){
  const r=ratings[key];
  if(!r||!r.count) return null;
  return {avg:r.total/r.count, count:r.count};
}

/* ── 별점 모달 ── */
function openModal(name, dateStr, mealType){
  modalKey=dishKey(dateStr, mealType, name);
  modalScore=0;
  $('modalDishName').textContent=name;
  $('reviewText').value='';
  updateStarUI(0);
  renderModalStat();
  renderReviewList();
  $('modalOverlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){
  $('modalOverlay').classList.remove('show');
  document.body.style.overflow='';
  renderMenu(lastParsed, toStr(cur), mt);
}
function renderModalStat(){
  const stat=avgStat(modalKey);
  const el=$('modalStat');
  if(stat){
    el.innerHTML=`
      <div class="modal-stat-score">
        <span class="modal-avg">${stat.avg.toFixed(1)}</span>
        <span class="modal-avg-max">/ 5</span>
      </div>
      <div class="modal-stat-detail">
        <div class="modal-stars-big">${starsHtml(stat.avg)}</div>
        <span class="modal-count-txt">${stat.count}명이 평가했어요</span>
      </div>`;
  } else {
    el.innerHTML=`<span class="modal-no-rating">아직 평가가 없어요. 첫 번째로 평가해보세요!</span>`;
  }
}
function renderReviewList(){
  const rl=$('reviewList');
  const r=ratings[modalKey];
  const mine=new Set((myReviews[modalKey]||[]).map(x=>x.id));
  if(!r||!r.reviews||!r.reviews.length){
    rl.innerHTML='<div class="rv-empty">첫 번째 리뷰를 남겨보세요!</div>'; return;
  }
  rl.innerHTML=[...r.reviews].reverse().map(rv=>{
    const isMine=rv.id && mine.has(rv.id);
    return `<div class="rv-item">
      <div class="rv-top">
        <span class="rv-stars">${starsHtml(rv.score)}</span>
        <span class="rv-score">${rv.score}점</span>
        ${isMine?'<span class="rv-mine">내 리뷰</span><button class="rv-del" data-id="'+escapeHtml(rv.id)+'">삭제</button>':''}
      </div>
      ${rv.comment?`<div class="rv-comment">${escapeHtml(rv.comment)}</div>`:''}
    </div>`;
  }).join('');
  rl.querySelectorAll('.rv-del').forEach(btn=>{
    btn.onclick=()=>deleteReview(btn.dataset.id);
  });
}
function updateStarUI(v){
  document.querySelectorAll('.si-star').forEach(s=>s.classList.toggle('on',+s.dataset.v<=v));
}
document.querySelectorAll('.si-star').forEach(s=>{
  s.onmouseenter=()=>updateStarUI(+s.dataset.v);
  s.onclick=()=>{ modalScore=+s.dataset.v; updateStarUI(modalScore); };
});
$('starRow').onmouseleave=()=>updateStarUI(modalScore);

$('btnSubmit').onclick=async ()=>{
  if(!modalScore){ showToast('별점을 선택해주세요!'); return; }
  const comment=$('reviewText').value.trim();
  const id=`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const newReview={ id, score:modalScore, comment };
  const docRef=doc(db,"ratings",modalKey);

  try{
    await setDoc(docRef, {
      total: increment(modalScore),
      count: increment(1),
      reviews: arrayUnion(newReview)
    }, { merge:true });

    if(!ratings[modalKey]) ratings[modalKey]={total:0,count:0,reviews:[]};
    ratings[modalKey].total+=modalScore;
    ratings[modalKey].count+=1;
    ratings[modalKey].reviews.push(newReview);

    if(!myReviews[modalKey]) myReviews[modalKey]=[];
    myReviews[modalKey].push({id, score:modalScore, comment});
    lsSet('yc_myrv', JSON.stringify(myReviews));

    showToast(`★ ${modalScore}점 등록!`, 'ok');
    modalScore=0; updateStarUI(0); $('reviewText').value='';
    renderModalStat(); renderReviewList();
    renderMenu(lastParsed, toStr(cur), mt);
  }catch(e){
    showToast('서버 저장 실패! 잠시 후 다시 시도해주세요.', 'err');
    console.error(e);
  }
};
async function deleteReview(id){
  const list=(myReviews[modalKey]||[]);
  const target=list.find(x=>x.id===id);
  if(!target) return;
  const docRef=doc(db,"ratings",modalKey);
  try{
    await updateDoc(docRef, {
      total: increment(-target.score),
      count: increment(-1),
      reviews: arrayRemove(target)
    });
    if(ratings[modalKey]){
      ratings[modalKey].total-=target.score;
      ratings[modalKey].count-=1;
      ratings[modalKey].reviews=(ratings[modalKey].reviews||[]).filter(r=>r.id!==id);
    }
    myReviews[modalKey]=list.filter(x=>x.id!==id);
    lsSet('yc_myrv', JSON.stringify(myReviews));
    showToast('리뷰를 삭제했어요', 'ok');
    renderModalStat(); renderReviewList();
    renderMenu(lastParsed, toStr(cur), mt);
  }catch(e){
    showToast('삭제 실패! 잠시 후 다시 시도해주세요.', 'err');
    console.error(e);
  }
}
$('btnCancel').onclick=closeModal;
$('btnCloseX').onclick=closeModal;
$('modalOverlay').onclick=e=>{ if(e.target===$('modalOverlay')) closeModal(); };

/* ── 영양·원산지 정보 모달 ── */
function openInfoModal(){
  const body=$('infoBody');
  if(!lastMeal){ body.innerHTML='<div class="info-empty">정보를 불러올 수 없습니다.</div>'; }
  else{
    const cal=lastMeal.CAL_INFO?lastMeal.CAL_INFO.trim():'';
    const ntrLines=(lastMeal.NTR_INFO||'').split(/<br\s*\/>/i).map(s=>s.trim()).filter(Boolean);
    const orLines=(lastMeal.ORPLC_INFO||'').split(/<br\s*\/>/i).map(s=>s.trim()).filter(Boolean);
    const toRow=s=>{
      const parts=s.split(':');
      const k=parts.shift();
      const v=parts.join(':').trim();
      return `<div class="info-line"><span>${escapeHtml((k||'').trim())}</span><span>${escapeHtml(v)}</span></div>`;
    };
    body.innerHTML=`
      <div class="info-sec">
        <div class="info-sec-title">칼로리</div>
        ${cal?`<div class="info-line"><span>총 열량</span><span>${escapeHtml(cal)}</span></div>`:'<div class="info-empty">정보 없음</div>'}
      </div>
      <div class="info-sec">
        <div class="info-sec-title">영양정보</div>
        ${ntrLines.length?ntrLines.map(toRow).join(''):'<div class="info-empty">정보 없음</div>'}
      </div>
      <div class="info-sec">
        <div class="info-sec-title">원산지정보</div>
        ${orLines.length?orLines.map(s=>`<div class="info-line"><span>${escapeHtml(s)}</span></div>`).join(''):'<div class="info-empty">정보 없음</div>'}
      </div>`;
  }
  $('infoModalOverlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeInfoModal(){
  $('infoModalOverlay').classList.remove('show');
  document.body.style.overflow='';
}
$('infoBtn').onclick=openInfoModal;
$('btnInfoCloseX').onclick=closeInfoModal;
$('infoModalOverlay').onclick=e=>{ if(e.target===$('infoModalOverlay')) closeInfoModal(); };

/* ── 공유하기 ── */
$('shareBtn').onclick=async ()=>{
  if(!lastParsed.length){ showToast('공유할 메뉴가 없어요'); return; }
  const dateLabel=`${cur.getFullYear()}.${pad(cur.getMonth()+1)}.${pad(cur.getDate())}(${DAYS[cur.getDay()]})`;
  const text=`영천고 ${MEAL_NAME[mt]} 메뉴 - ${dateLabel}\n\n${lastParsed.map(x=>'• '+x.name).join('\n')}`;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      showToast('메뉴가 클립보드에 복사되었어요', 'ok');
    } else {
      throw new Error('clipboard unsupported');
    }
  }catch(e){
    showToast('복사에 실패했어요', 'err');
  }
};

/* ── 파이어베이스 연동 ── */
async function fetchFirebaseRatings(parsed, dateStr, mealType){
  try {
    const promises = parsed.map(async (item) => {
      const key = dishKey(dateStr, mealType, item.name);
      const docRef = doc(db, "ratings", key);
      const docSnap = await getDoc(docRef);
      if(docSnap.exists()){
        ratings[key] = docSnap.data();
      }
    });
    await Promise.all(promises);
  } catch(e) {
    console.error("Firebase 로드 실패:", e);
  }
}

/* ── API ── */
async function fetchMeal(snapDate, snapMt, silent){
  const dateStr = toStr(snapDate);
  const url=`${BASE}/mealServiceDietInfo?KEY=${KEY}&Type=json&ATPT_OFCDC_SC_CODE=R10&SD_SCHUL_CODE=${SC}&MLSV_YMD=${dateStr}&MMEAL_SC_CODE=${snapMt}`;
  try{
    const res=await fetch(url);
    const json=await res.json();

    if(!json.mealServiceDietInfo || json.RESULT){
      if(!silent){
        $('menuList').innerHTML='<div class="state-box"><span class="em">📭</span>급식 정보가 없습니다<br><small style="font-size:11px;color:var(--text3);display:block;margin-top:4px">아직 등록되지 않았거나 휴무일입니다</small></div>';
        lastMeal=null;
        $('kcalChip').classList.remove('show');
      }
      return null;
    }

    const info = json.mealServiceDietInfo;
    const rowBlock = info.find(b => b && Array.isArray(b.row));
    if(!rowBlock || !rowBlock.row.length){
      if(!silent){
        $('menuList').innerHTML='<div class="state-box"><span class="em">📭</span>급식 정보가 없습니다</div>';
        lastMeal=null;
        $('kcalChip').classList.remove('show');
      }
      return null;
    }
    const meal = rowBlock.row[0];

    if(!silent){
      lastMeal=meal;
      if(meal.CAL_INFO){ $('kcalVal').textContent=meal.CAL_INFO.trim(); $('kcalChip').classList.add('show'); }
      else { $('kcalChip').classList.remove('show'); }
      const parsed = parseItems(meal.DDISH_NM||'');

      await fetchFirebaseRatings(parsed, dateStr, snapMt);
      renderMenu(parsed, dateStr, snapMt);
    }
    return meal;
  }catch(e){
    if(!silent){
      $('menuList').innerHTML='<div class="state-box"><span class="em">⚠️</span>불러올 수 없습니다</div>';
      lastMeal=null;
      $('kcalChip').classList.remove('show');
    }
    return null;
  }
}

function loadCurrent(){
  const snapDate = new Date(cur);
  const snapMt   = mt;
  $('menuList').innerHTML=`<div class="skeleton">
    ${Array(6).fill('<div class="sk-card"></div>').join('')}
  </div>`;
  $('kcalChip').classList.remove('show');
  lastParsed=[];
  fetchMeal(snapDate, snapMt, false);
}

/* ── 주간 스트립 ── */
async function renderWeekPanel(){
  const snapCurStr = toStr(cur);
  const snapMt     = mt;
  const wc=$('weekContent');
  wc.innerHTML='<div class="wd-loading">불러오는 중...</div>';

  const monday=new Date(weekAnchor);
  const dow=weekAnchor.getDay();
  monday.setDate(weekAnchor.getDate()+(dow===0?-6:1-dow));

  const todayStr=toStr(today());
  const days=Array.from({length:5},(_,i)=>{
    const d=new Date(monday); d.setDate(monday.getDate()+i); return d;
  });

  $('weekRange').textContent=`${pad(days[0].getMonth()+1)}.${pad(days[0].getDate())} ~ ${pad(days[4].getMonth()+1)}.${pad(days[4].getDate())}`;

  wc.innerHTML=days.map(d=>{
    const ds=toStr(d);
    const isToday=ds===todayStr, isSel=ds===snapCurStr;
    return `<div class="week-day${isToday?' wd-today':''}${isSel?' wd-sel':''}" id="wd_${ds}">
      <div class="wd-top">
        <span class="wd-date">${d.getDate()}</span>
        <span class="wd-dayname">${DAYS[d.getDay()]}요일</span>
        ${isToday?'<span class="wd-badge">오늘</span>':''}
      </div>
      <div class="wd-items" id="wdi_${ds}">…</div>
    </div>`;
  }).join('');

  await Promise.all(days.map(async d=>{
    const ds=toStr(d);
    const meal=await fetchMeal(d, snapMt, true);
    const card=$(`wd_${ds}`);
    const el=$(`wdi_${ds}`);
    if(!card||!el) return;
    if(meal){
      el.textContent=parseItems(meal.DDISH_NM||'').slice(0,3).map(x=>x.name).join(' · ')||'-';
      card.classList.add('clickable');
      card.onclick=()=>{
        cur=new Date(d.getFullYear(),d.getMonth(),d.getDate());
        drawDate(); loadCurrent(); renderWeekPanel();
      };
    } else {
      el.className='wd-none'; el.textContent='급식 없음';
      card.classList.add('no-meal');
    }
  }));
}
$('weekPrev').onclick=()=>{ weekAnchor.setDate(weekAnchor.getDate()-7); renderWeekPanel(); };
$('weekNext').onclick=()=>{ weekAnchor.setDate(weekAnchor.getDate()+7); renderWeekPanel(); };

/* ── 달력 ── */
function drawCal(){
  const y=calView.getFullYear(), m=calView.getMonth();
  $('calMonth').textContent=`${y}.${pad(m+1)}`;
  const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
  const todayStr=toStr(today()), curStr=toStr(cur);
  let html='';
  for(let i=0;i<first;i++) html+=`<span class="cal-d empty"></span>`;
  for(let d=1;d<=last;d++){
    const dd=new Date(y,m,d), ds=toStr(dd);
    const off=dd.getDay()===0||dd.getDay()===6;
    html+=`<span class="cal-d${off?' off':''}${ds===todayStr?' today':''}${ds===curStr?' sel':''}" data-d="${ds}">${d}</span>`;
  }
  $('calGrid').innerHTML=html;
  $('calGrid').querySelectorAll('.cal-d:not(.off):not(.empty)').forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const s=el.dataset.d;
      cur=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
      weekAnchor=new Date(cur);
      drawDate(); loadCurrent(); renderWeekPanel();
      $('calPopup').classList.remove('show');
    };
  });
}

/* ── 이벤트 ── */
$('prev').onclick=()=>{
  const d=new Date(cur); d.setDate(d.getDate()-1);
  if(d.getDay()===0) d.setDate(d.getDate()-2);
  cur=d; weekAnchor=new Date(cur); drawDate(); loadCurrent(); renderWeekPanel();
};
$('next').onclick=()=>{
  const d=new Date(cur); d.setDate(d.getDate()+1);
  if(d.getDay()===6) d.setDate(d.getDate()+2);
  cur=d; weekAnchor=new Date(cur); drawDate(); loadCurrent(); renderWeekPanel();
};
$('todayBtn').onclick=()=>{ cur=today(); fixWE(cur); weekAnchor=new Date(cur); drawDate(); loadCurrent(); renderWeekPanel(); };
$('dateWrap').onclick=e=>{ e.stopPropagation(); calView=new Date(cur); drawCal(); $('calPopup').classList.toggle('show'); };
$('calPrev').onclick=e=>{ e.stopPropagation(); calView.setMonth(calView.getMonth()-1); drawCal(); };
$('calNext').onclick=e=>{ e.stopPropagation(); calView.setMonth(calView.getMonth()+1); drawCal(); };
document.addEventListener('click',()=>$('calPopup').classList.remove('show'));
$('calPopup').onclick=e=>e.stopPropagation();

document.querySelectorAll('.meal-tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.meal-tab').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on'); mt=parseInt(tab.dataset.t);
    loadCurrent(); renderWeekPanel();
  };
});

/* ── 초기화 ── */
buildAllergy();
drawDate();
loadCurrent();
renderWeekPanel();
</script>
